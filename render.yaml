# Render Blueprint: free static site, used as a client preview.
# Render serves /404.html automatically (with a 404 status) for paths that don't exist.
services:
  - type: web
    name: time-and-chance
    runtime: static
    staticPublishPath: .
    headers:
      # Keeps the preview out of search engines. TODO-LAUNCH: remove this header on the production domain.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      # The sha256 is the inline script in index.html <head>; update it if that script changes.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-sa2BD07tH4oO53uT1B5vNSLM2+gcrREM4WTXttKp6oU='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; form-action 'self' mailto:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
